<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f4">
  <title>Chats | MediaFeria</title>
  <link rel="icon" href="/assets/images/mediaferia-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/features.css">
  <script src="/assets/js/session.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/chat.js" defer></script>
</head>
<body>
  <header class="feature-header">
    <a class="feature-brand" href="/pages/dashboard.html">MediaFeria</a>
    <nav class="feature-nav" aria-label="Navegación">
      <a href="/pages/dashboard.html">Panel</a>
      <a href="/pages/ferias.html">Ferias</a>
      <a href="/pages/solicitudes.html">Solicitudes</a>
      <a href="/pages/chat.html" aria-current="page">Chats</a>
    </nav>
  </header>
  <main class="feature-main">
    <section class="feature-intro">
      <p class="feature-kicker">MEDIAFERIA · MENSAJES</p>
      <h1>Conversaciones</h1>
      <p>Contacta de forma privada con organizadores, ayuntamientos y feriantes.</p>
    </section>
    <p id="page-message" class="feature-message" role="status" aria-live="polite"></p>
    <div class="chat-layout">
      <aside class="chat-sidebar">
        <h2>Contactos</h2>
        <form id="start-chat-form" class="chat-start">
          <label for="contact-select" class="feature-muted">Iniciar conversación</label>
          <select id="contact-select" class="chat-select" required>
            <option value="">Elige una persona</option>
          </select>
          <button class="feature-button" type="submit">Abrir chat</button>
        </form>
        <div id="conversation-list" class="chat-list" aria-label="Conversaciones"></div>
      </aside>
      <section class="chat-room" aria-label="Mensajes">
        <h2 id="chat-title">Elige una conversación</h2>
        <div id="messages" class="chat-messages" aria-live="polite">
          <p class="feature-empty">Tus mensajes aparecerán aquí.</p>
        </div>
        <form id="send-message-form" class="chat-send" hidden>
          <label class="visually-hidden" for="message-input">Escribe un mensaje</label>
          <input id="message-input" class="chat-input" maxlength="2000" autocomplete="off" placeholder="Escribe un mensaje…" required>
          <button class="feature-button" type="submit">Enviar</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
